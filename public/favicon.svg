<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="avatar-clip">
      <circle cx="50" cy="50" r="47" />
    </clipPath>
  </defs>
  <!-- Background / Theme ring border -->
  <circle cx="50" cy="50" r="49" fill="#3b82f6" />
  <!-- Avatar image centered on the face -->
  <image
    href="/profile.png"
    x="-35"
    y="-2"
    width="170"
    height="100"
    preserveAspectRatio="xMidYMin slice"
    clip-path="url(#avatar-clip)"
  />
</svg>
